name: Gerar APK Monitor de Dados

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  compilar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar seus arquivos do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar o compilador Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Montar estrutura do projeto Android automaticamente
        run: |
          # Cria as pastas exigidas pelo Android
          mkdir -p app/src/main/java/com/example/monitordados
          mkdir -p app/src/main/assets

          # Move seus 3 arquivos da raiz para as pastas certas
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/example/monitordados/MainActivity.kt
          cp index.html app/src/main/assets/index.html

          # Cria as configurações do Gradle automaticamente
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonitorDados"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.monitordados'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.monitordados"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

      - name: 5. Compilar o aplicativo APK
        run: gradle assembleDebug

      - name: 6. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-Dados-Instalador-APK
          path: app/build/outputs/apk/debug/app-debug.apk
